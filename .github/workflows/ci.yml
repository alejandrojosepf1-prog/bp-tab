name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp
          POSTGRES_DB: bp_tab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bp -d bp_tab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # The test suite runs mainly against an in-memory SQLite fixture (see
      # backend/tests/conftest.py) so it doesn't strictly need Postgres, but a service
      # container is kept as a safety net so anything importing app.core.config.Settings
      # (or hitting a real DB path) has somewhere valid to point at.
      DATABASE_URL: postgresql+asyncpg://bp:bp@localhost:5432/bp_tab
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://bp:bp@localhost:5432/bp_tab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend package (with dev extras)
        run: pip install -e ".[dev]"

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy app/

      - name: pytest
        run: pytest tests/ -q

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend
