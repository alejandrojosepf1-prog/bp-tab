# Render Blueprint for the free-tier deployment of BP$.
#
# This intentionally does NOT include Postgres or Redis/Celery services: Postgres is provided
# by a free Neon project instead (paste its connection string as DATABASE_URL when Render asks
# for the unset env vars during blueprint setup), and Celery is skipped entirely -- the backend
# already has a Celery-independent scraping path (`POST /tournaments/{id}/scrape` via FastAPI
# BackgroundTasks, see app/api/routers/tournaments.py) built for exactly this "no guaranteed
# broker" scenario, so no worker/beat service is needed for a friends-scale free deployment.
#
# Both services build directly from the existing Dockerfiles (backend/Dockerfile,
# frontend/Dockerfile) used by docker-compose.yml for local development -- no separate
# deploy-only Dockerfile needed.

services:
  - type: web
    name: bp-tab-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # No dockerCommand override: Render's dockerCommand field does not reliably shell-parse
    # `&&`/env-var chains passed inline (confirmed against real deploy failures -- exit 127 with
    # a `sh -c "..."` wrapper, exit 128 without one), so migrations + server startup are instead
    # baked into the image's own entrypoint (backend/docker-entrypoint.sh / Dockerfile CMD),
    # which Render just runs as-is. That script already binds to $PORT.
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string here during blueprint setup
      - key: JWT_SECRET
        generateValue: true # Render generates a random production secret automatically
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # NOTE: Render appended a random suffix to the service name (bp-tab-frontend-5xwd instead
      # of bp-tab-frontend) since the plain name was already taken -- update this value to match
      # whatever your actual frontend service URL turns out to be if it's not this one.
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://bp-tab-frontend-5xwd.onrender.com"]'
      # No REDIS_URL/CELERY_* here: Settings has working defaults, and nothing on this deploy
      # path touches Celery/Redis (see comment above).

  - type: web
    name: bp-tab-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # NEXT_PUBLIC_* is inlined into the client bundle at build time (see frontend/Dockerfile's
    # ARG), so this must also be passed as a Docker build arg, not just a runtime env var --
    # Render does this automatically for any envVar whose key matches a Dockerfile ARG.
    # No dockerCommand override: the Dockerfile's own CMD (`npm start` -> `next start`) already
    # reads the PORT env var natively, so the default CMD works as-is.
    envVars:
      # See the NOTE above on the backend service's CORS_ALLOWED_ORIGINS about the -5xwd suffix.
      - key: NEXT_PUBLIC_API_URL
        value: https://bp-tab-backend-5xwd.onrender.com
