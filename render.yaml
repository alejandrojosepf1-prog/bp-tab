# Render Blueprint for the free-tier deployment of Claim's BACKEND only.
#
# The frontend moved to Vercel (2026-08-03) -- Vercel is a much better fit for Next.js (no
# 15-minute spin-down, first-class framework support, still free) and the backend never
# belonged there anyway (Vercel's serverless functions can't host the long-lived autoscrape
# loop below). Deleting `bp-tab-frontend` from this Blueprint does NOT tear down the live
# Render service by itself -- suspend or delete it by hand in the Render dashboard once
# Vercel is confirmed working.
#
# This intentionally does NOT include Postgres or Redis/Celery services: Postgres is provided
# by a free Neon project instead (paste its connection string as DATABASE_URL when Render asks
# for the unset env vars during blueprint setup), and Celery is skipped entirely.
#
# Scraping without Celery happens two ways, neither of which needs a broker:
#   - Periodic/automatic: `app/tasks/autoscrape.py` runs an asyncio loop inside the API process
#     itself, owned by the FastAPI lifespan, re-scraping every active tournament on
#     SCRAPE_INTERVAL_SECONDS. This is what keeps markets fresh and settles finished rounds with
#     no admin action. Set AUTOSCRAPE_ENABLED=false if a real Celery beat is ever deployed.
#   - On demand: `POST /tournaments/{id}/scrape` via FastAPI BackgroundTasks (the admin panel's
#     "Forzar scraping" button).
#
# NOTE on the free plan: Render spins a free web service down after ~15 minutes with no inbound
# requests, and the autoscrape loop is suspended along with the process. It resumes on the next
# request that wakes the service. For a live tournament that's fine (people are using the app);
# if you need guaranteed round-the-clock scraping, either upgrade off the free plan or point an
# external uptime pinger at /health.
#
# Both services build directly from the existing Dockerfiles (backend/Dockerfile,
# frontend/Dockerfile) used by docker-compose.yml for local development -- no separate
# deploy-only Dockerfile needed.

services:
  - type: web
    name: bp-tab-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # No dockerCommand override: Render's dockerCommand field does not reliably shell-parse
    # `&&`/env-var chains passed inline (confirmed against real deploy failures -- exit 127 with
    # a `sh -c "..."` wrapper, exit 128 without one), so migrations + server startup are instead
    # baked into the image's own entrypoint (backend/docker-entrypoint.sh / Dockerfile CMD),
    # which Render just runs as-is. That script already binds to $PORT.
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string here during blueprint setup
      - key: JWT_SECRET
        generateValue: true # Render generates a random production secret automatically
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Frontend now lives on Vercel (see the file-level note above), not the bp-tab-frontend
      # Render service this used to point at. Update the live env var on the Render dashboard
      # too -- this file alone doesn't push config to an already-running service.
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://claim-six-theta.vercel.app", "https://claim-nwlfpr7lr-claim3.vercel.app"]'
      # Was never actually set here before -- silently defaulted to Settings' localhost:3000
      # fallback in production too, meaning any access-pass activation email
      # (app.services.email_service.send_activation_email) would have linked to a broken
      # localhost URL for whoever received one. Same class of fix as CORS above.
      - key: FRONTEND_BASE_URL
        value: https://claim-six-theta.vercel.app
      # No REDIS_URL/CELERY_* here: Settings has working defaults, and nothing on this deploy
      # path touches Celery/Redis (see comment above).

  # bp-tab-frontend removed 2026-08-03 -- replaced by Vercel. The live Render service isn't
  # deleted by removing it here; suspend/delete it by hand once Vercel is confirmed working.
